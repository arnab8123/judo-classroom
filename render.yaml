services:
  - type: web
    name: judo-classroom
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DB_PATH
        value: ./data/classroom.sqlite
      - key: UPLOAD_DIR
        value: ./uploads
      - key: BACKUP_DIR
        value: ./backups
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: AUTH_SECRET
        generateValue: true
      - key: SEED_TEACHER_NAME
        sync: false
      - key: SEED_TEACHER_EMAIL
        sync: false
      - key: SEED_TEACHER_PASSWORD
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_HTTP_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Judo <verify@judomeet.online>
